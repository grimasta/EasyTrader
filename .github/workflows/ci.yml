name: CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set dummy env vars
        run: |
          echo "BITGET_API_KEY=dummy" >> $GITHUB_ENV
          echo "BITGET_API_SECRET=dummy" >> $GITHUB_ENV
          echo "BITGET_API_PASSPHRASE=dummy" >> $GITHUB_ENV
          echo "EXIT_LOG_FILE=/tmp/exit_log.csv" >> $GITHUB_ENV

      - name: Run tests
        run: pytest test/ -v --tb=short